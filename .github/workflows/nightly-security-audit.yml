name: Nightly Security & Dependency Vulnerability Audit

on:
  schedule:
    # Run automatically every night at 2:00 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  audit-and-verify:
    name: Automated Security Audit & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run dependency vulnerability audit
        run: npm run audit:vulnerabilities

      - name: Verify build compilation
        run: npm run build

      - name: Upload audit report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-audit-report
          path: .tmp/audit-report.md
